text: >
    Mid-Level Software Developer with five years' experience at Crown Gas & Power, having
    progressed from Junior Developer to owning delivery of key strategic projects end-to-end.
    Fullstack background spanning PHP/Laravel, Vue, Python/FastAPI, TypeScript/Nuxt and Rust,
    having delivered a portal migration with single sign-on, an end-to-end electricity pricing
    system, and a fully automated pricing engine. Works directly with stakeholders and Business
    Analysts to shape requirements, contributes to architecture and technical decision-making on
    major initiatives such as Fusion, and supports onboarding of new starters. First-class BSc
    Computer Science graduate.
