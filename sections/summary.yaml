text: >
    Mid-Level Software Developer with five years' experience at Crown Gas & Power, having
    progressed from Junior Developer to owning delivery of key strategic projects end-to-end.
    Fullstack background spanning PHP/Laravel, Vue, Python/FastAPI, TypeScript/Nuxt and Rust,
    having built a new customer portal and modernised an existing one, with single sign-on across
    both, and delivered an end-to-end electricity pricing system, including a fully automated pricing engine that cut pricing time from hours to
    minutes. Works directly with stakeholders, Product Owners and Product Managers to shape
    requirements, and supports onboarding of new starters. Contributes to architecture and
    technical decision-making on Fusion, a complete suite of new applications and architecture
    for the business. First-class BSc Computer Science graduate.
