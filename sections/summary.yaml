text: >
    Full-stack developer at Crown Gas & Power, promoted from junior to mid-level and now doing
    senior-level work, from merging the team's pull requests to shaping architecture. Founding
    developer on Fusion, the company's next-generation application platform, which has grown to a
    team of five. Built the electricity pricing engine that cut pricing from hours to minutes, and
    the Power Portal, which had around 30,000 users at launch. Language-agnostic across PHP/Laravel,
    Rust, Python/FastAPI and TypeScript with Vue and Nuxt. Works AI-first with Claude using custom
    skills and agents, and turns AI-generated prototypes into properly engineered code. Works
    directly with Product Owners and business stakeholders to shape requirements. First Class BSc
    Computer Science, Lancaster.
