entries:
  - name: Fusion (Ongoing)
    organisation: Crown Gas & Power
    details:
      - Improved the pricing engine for Fusion as a standalone microservice (PHP/Laravel and Rust), running in parallel with the EPS pricing engine and set to replace it once Fusion is delivered.
      - Contributing to Crown Gas & Power's next-generation application platform across PHP/Laravel, Python/FastAPI and TypeScript/Nuxt, backed by Redis, RabbitMQ and Kong.
    tech: [PHP/Laravel, Python, FastAPI, Rust, TypeScript, Nuxt, Redis, RabbitMQ, Kong, AWS]
    tags: [core]
  - name: Electricity Pricing System (EPS)
    organisation: Crown Gas & Power
    details:
      - Replaced a fully manual, Excel-based sales process with a central source of truth, starting with the nominations module and integrating the external ECOES and ElectraLink APIs.
      - Extended the system into the wider quotation and contracts process for the sales team.
      - Built the EPS pricing engine, porting the sales team's entire pricing model - previously a heavy Excel spreadsheet that could lock a PC and take hours to return a single price - at the same level of accuracy.
      - Used asynchronous processing (Laravel Horizon and Supervisor) to cut pricing time from hours to minutes, freeing the sales team to work on other tasks while prices generate.
      - Covered date mapping, generation of profile percentages, site-level price curves, individual price calculations and breakdowns, and generation of final unit rates and standing charges.
      - Took over and validated the Rust port of the pricing engine for EPS, roughly 7x faster than the PHP version and cutting pricing time from minutes to seconds.
    tech: [PHP/Laravel, Rust, MySQL, Laravel Horizon, Supervisor]
    tags: [core]
  - name: Power Portal, Gas Portal Modernisation & SSO
    organisation: Crown Gas & Power
    details:
      - Built the Power Portal from the ground up, giving electricity customers online access to their account data for the first time, with ~30,000 portal users at launch.
      - Led the modernisation of the Gas Portal onto an updated technology stack, covering both backend and frontend.
      - Implemented Single Sign-On (SSO) across Gas and Power, reducing login friction for shared customers.
      - "Automated meter read processing on the Gas Portal so metering staff only handle exceptions ('bad reads'); valid reads import automatically into Genus, a third-party industry linking application."
      - Worked directly with two key business stakeholders to gather requirements and develop the solution, with no Business Analyst involved.
    tech: [PHP/Laravel, Vue, MySQL]
    tags: [core]