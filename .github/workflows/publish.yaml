name: Publish

on: push

# Read-only by default. The publish job raises its own permissions rather than
# widening them for the whole workflow.
permissions:
  contents: read

# A Pages deployment cannot run alongside another one, so a newer push waits for
# the running deployment to finish rather than being cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate the CV data and run the tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install the system libraries WeasyPrint needs
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpango-1.0-0 libpangoft2-1.0-0

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # --locked fails the build if uv.lock no longer matches pyproject.toml,
      # rather than quietly resolving different versions than the ones tested.
      - name: Install dependencies
        run: uv sync --locked

      - name: Run the test suite
        run: uv run pytest

  publish:
    name: Publish the default variant to GitHub Pages
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install the system libraries WeasyPrint needs
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpango-1.0-0 libpangoft2-1.0-0

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Render the default variant to JSON
        run: uv run python -m renderer.render --variant default --format json

      - name: Upload the rendered JSON
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
