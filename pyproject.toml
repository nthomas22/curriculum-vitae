[project]
name = "curriculum-vitae"
authors = [
    {name = "Nathan Thomas", email = "nathanthomas126@gmail.com"},
]
version = "0.1.0"
description = "A structured, tag-driven CV that renders to PDF and JSON from a single source of truth."
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "weasyprint>=69.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.urls]
Repository = "https://github.com/nthomas22/curriculum-vitae"
